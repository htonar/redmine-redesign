name: Desktop release (Tauri)

# Только ручной запуск - осознанно не triggers: push/pull_request. Сборка
# полной матрицы (win/macOS/linux, ~5-10 минут на платформу) по каждому пушу
# в main была бы лишней тратой минут CI на десктоп-дистрибутив, который
# пользователи не тянут на каждый коммит - только когда реально нужен новый
# релиз. См. CLAUDE.md, "Бэклог: паковка в десктоп-приложение + CI/CD".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (semver, без 'v' - например 0.2.0)"
        required: true
      prerelease:
        description: "Пометить релиз как pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Все платформы матрицы пишут в один и тот же тег/релиз (redfine-v<version>) -
# без этого два случайно параллельных запуска на одну версию могли бы
# конфликтовать друг с другом при создании тега.
concurrency:
  group: desktop-release-${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - universal binary (Apple Silicon + Intel одним артефактом),
          # стандартная рекомендация Tauri для macos-latest раннеров.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Версия - только через ручной ввод при запуске (см. описание триггера
      # выше), не производная от git-тега/пуша. Правит package.json - для
      # версии самого Tauri-бандла этого мало, см. следующий шаг.
      - name: Set version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # npm version выше трогает только package.json. tauri.conf.json
      # намеренно без своего "version" (см. ниже) - но Tauri в этом случае
      # падает обратно на версию из src-tauri/Cargo.toml, а не package.json,
      # так что без этого шага бандл собирался бы со старой версией
      # Cargo.toml независимо от введенной здесь версии (баг, найден и
      # исправлен - см. CLAUDE.md).
      - name: Sync Tauri (Cargo.toml) version
        run: node scripts/sync-tauri-version.mjs "${{ inputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Автообновление (GitHub issue #2, @tauri-apps/plugin-updater) -
          # без этих двух секретов tauri-action соберет бандлы, но не
          # подпишет их и не создаст latest.json, и обновление в
          # приложении никогда не найдет новую версию (публичный ключ уже
          # зашит в src-tauri/tauri.conf.json, plugins.updater.pubkey -
          # приватный существует только как секрет репозитория, в
          # исходниках его нет и не должно быть). createUpdaterArtifacts:
          # true в tauri.conf.json - сигнал самому Tauri CLI генерировать
          # .sig-файлы и latest.json, tauri-action просто прокидывает
          # переменные окружения, которые CLI ожидает для подписи.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: redfine-v${{ inputs.version }}
          releaseName: "Redfine v${{ inputs.version }}"
          # Инструкция по установке прямо в теле релиза - иначе с голым
          # списком .exe/.msi/.dmg/.deb/.rpm/.AppImage/.tar.gz/.sig без
          # единого пояснения непонятно, что вообще качать (зафиксировано
          # пользователем 2026-08-13). Версия зашита через ${{ inputs.version
          # }} - имена файлов ниже совпадают с реальным выводом Tauri-бандлера
          # (проверено по содержимому черновиков redfine-v0.1.0/0.1.1).
          releaseBody: |
            ## Установка

            Приложение не подписано ни у Microsoft, ни у Apple (нет платного
            сертификата) - ОС на первом запуске предупредит об этом, ниже
            написано, как пройти это предупреждение. Это ожидаемо, не повод
            считать сборку сломанной.

            ### Windows
            Скачать и запустить **один** из двух (оба ставят одно и то же):
            - `Redfine_${{ inputs.version }}_x64-setup.exe`
            - `Redfine_${{ inputs.version }}_x64_en-US.msi`

            При запуске SmartScreen покажет "Windows защитила ваш компьютер" -
            нажать "Подробнее", затем "Выполнить в любом случае". Нужен
            WebView2 Runtime - на Windows 10 (1809+)/11 он обычно уже
            установлен; если приложение не откроется, поставить отдельно:
            https://developer.microsoft.com/microsoft-edge/webview2/

            ### macOS
            - `Redfine_universal.dmg` - смонтировать двойным кликом,
              перетащить `Redfine.app` в `Applications`.
            - `Redfine_universal.app.tar.gz` - **не для ручной установки**,
              нужен только автообновлению внутри приложения (см. ниже).

            Gatekeeper заблокирует первый запуск ("файл повреждён" или
            "нельзя проверить издателя") - открыть через правый клик по
            `Redfine.app` → "Открыть" вместо двойного клика (только один
            раз, дальше запускается как обычно).

            ### Linux
            - `.deb`: `sudo apt install ./Redfine_${{ inputs.version }}_amd64.deb`
            - `.rpm`: `sudo dnf install ./Redfine-${{ inputs.version }}-1.x86_64.rpm`
              (или `rpm -i` на дистрибутивах без dnf)
            - `.AppImage`: `chmod +x Redfine_${{ inputs.version }}_amd64.AppImage`,
              затем запустить файл напрямую - установка не нужна.

            ### Автообновление
            После установки приложение само проверяет новые версии (пункт
            "Проверить обновления" в меню профиля справа сверху) - находит
            только **опубликованные** релизы, не черновики.

            ### Файлы `.sig`
            Не для скачивания вручную - это подписи Tauri-обновлятора,
            приложение использует их само при проверке подлинности
            автообновления.

            ---
            См. CLAUDE.md в репозитории для истории изменений.
          # Черновик - сознательно: даже успешная сборка матрицы не публикует
          # релиз сама, кто-то должен глазами проверить артефакты и нажать
          # "Publish" в GitHub UI, прежде чем он станет виден пользователям.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
