[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon - системный трей (issue #5). image-png - чтобы
# tauri::image::Image::from_bytes сам декодировал PNG-иконку в raw RGBA
# без отдельного крейта `image` в зависимостях.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
# rustls вместо native-tls (openssl) - чистый Rust без системной OpenSSL,
# упрощает кросс-компиляцию под Windows/macOS (см. CLAUDE.md, десктоп-трек:
# Windows-поддержка нужна с самого начала, не только Linux).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt"] }
# Автообновление (GitHub issue #2) - default-features выключены по той же
# причине, что и у reqwest выше: без rustls-tls плагин тянет native-tls
# (системную OpenSSL), которой нет по умолчанию на Windows/чистых сборочных
# образах.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
# OS push-уведомления (issue #3) - назначение задачи, смена статуса,
# активность по наблюдаемым задачам, приближение дедлайна.
tauri-plugin-notification = "2"
# Открытие ссылок в системном браузере (issue #24) - обычный
# `<a target="_blank">` в Tauri webview его не открывает, нужен отдельный
# плагин с shell-open командой.
tauri-plugin-opener = "2"
